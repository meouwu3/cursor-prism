<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <style>
    .ink { stroke: #1B1A16; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #F2F0E9; }
    }
  </style>
  <!-- Incoming beam -->
  <line x1="2" y1="20" x2="18" y2="24" class="ink" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Refracted spectrum -->
  <line x1="30" y1="22" x2="46" y2="14" stroke="#D9481C" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="30" y1="24" x2="46" y2="21" class="ink" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <line x1="30" y1="26" x2="46" y2="28" class="ink" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>
  <line x1="30" y1="28" x2="46" y2="35" stroke="#D9481C" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>
  <!-- The prism -->
  <path d="M24 8 L36 36 L12 36 Z" class="ink" stroke-width="2" stroke-linejoin="round"/>
</svg>
